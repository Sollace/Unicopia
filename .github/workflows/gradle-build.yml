name: Build on Push
on:
  - push
jobs:
  gradle:
    runs-on: codeberg-small
    steps:
      - name: Checkout Commit
        uses: github.com/actions/checkout@v6
      - name: Fetch Tags
        run: git fetch --unshallow --tags -f
      - name: Set up JDK
        uses: github.com/actions/setup-java@v5
        with:
          java-version: 21
      - name: Build Gradle
        uses: github.com/gradle/actions/setup-gradle@v6
        with:
          arguments: check
